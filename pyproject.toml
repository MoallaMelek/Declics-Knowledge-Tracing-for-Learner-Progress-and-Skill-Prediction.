[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "declic-axis7"
version = "0.1.0"
description = "Causal knowledge tracing and an evidence-linked learning digital twin"
requires-python = ">=3.12"
dependencies = ["torch>=2.5,<3", "numpy>=2,<3", "pandas>=2,<4", "scikit-learn>=1.5,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "jsonschema>=4.26,<5"]

[tool.setuptools.packages.find]
include = ["axis7*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
