name: Axis 7 validation
on:
  push:
  pull_request:
jobs:
  contracts-and-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU dependencies
        run: python -m pip install -e '.[test]' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Check interface syntax
        run: |
          node --check web/app.js
          node --check web/musician.js
          node --check web/case-study.js
          node --check web/musical-cloud.js
          node --check web/musical-demo.js
          node --check web/o08.js
          node --check web/home.js
          node --check web/labo.js
          for f in web/living/*.js web/learn/*.js; do node --check "$f"; done
          node --check tests/browser/learner_e2e.cjs
      - name: Validate contracts and models
        run: python -B -m pytest -q -p no:cacheprovider
  real-http-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU and pinned browser test dependencies
        run: |
          python -m pip install -e '.[test]' --extra-index-url https://download.pytorch.org/whl/cpu
          npm ci
          npx playwright install --with-deps chromium
      - name: Real HTTP and Chromium with synthetic histories and copied trained tensors
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: npm run test:browser
      - name: Preserve labeled evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-synthetic-integration-real-weights
          path: |
            runtime/e2e/results.json
            runtime/e2e/server.log
            runtime/e2e/*.png
            runtime/e2e-learner/results.json
            runtime/e2e-learner/*.png
