name: Axis 7 validation
on:
  push:
  pull_request:
jobs:
  contracts-and-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU dependencies
        run: python -m pip install -e '.[test]' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Check interface syntax
        run: |
          node --check web/app.js
          node --check web/musician.js
          node --check web/case-study.js
          node --check web/musical-cloud.js
          node --check web/musical-demo.js
          node --check web/o08.js
          for f in web/living/*.js; do node --check "$f"; done
      - name: Validate contracts and models
        run: python -B -m pytest -q -p no:cacheprovider
